[package]
name = "omnimd-native"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.82"

[dependencies]
omnimd-ml-contract = { path = "../contract" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

# Already approved/shared by the engine; provenance hashing only.
sha2 = "0.10"
# cudarc-based device runtime (plan W5+); loads CUDA at run time.
omnimd-gpu = { path = "../gpu", optional = true }

[features]
default = []
cuda = []
gpu = ["dep:omnimd-gpu"]

[[bin]]
name = "omnimd-native-cuda-eval"
path = "src/bin/omnimd-native-cuda-eval.rs"
required-features = ["cuda"]

[[bin]]
name = "omnimd-native-gpu-eval"
path = "src/bin/omnimd-native-gpu-eval.rs"
required-features = ["gpu"]

[[bin]]
name = "omnimd-native-gpu-train"
path = "src/bin/omnimd-native-gpu-train.rs"
required-features = ["gpu"]

[[bin]]
name = "omnimd-native-gpu-test"
path = "src/bin/omnimd-native-gpu-test.rs"
required-features = ["gpu"]

[[bin]]
name = "omnimd-native-cuda-check"
path = "src/bin/omnimd-native-cuda-check.rs"
required-features = ["cuda"]
