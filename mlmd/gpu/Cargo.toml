[package]
name = "omnimd-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Device runtime for omniMD: cudarc context, NVRTC kernel cache and cuBLAS dense layers"

[dependencies]
omnimd-ml-contract = { path = "../contract" }
sha2 = "0.10"

# Loaded at run time (ADR-2): builds and tests without a CUDA toolkit; device
# tests skip unless a driver is present or OMNIMD_REQUIRE_GPU=1.
[dependencies.cudarc]
version = "0.19.10"
default-features = false
features = ["std", "driver", "nvrtc", "cublas", "dynamic-loading", "cuda-12080"]
