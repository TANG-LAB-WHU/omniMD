name: mlmd CI

on:
  push:
    branches: ["main", "dev", "shawn_dev"]
    paths:
      - "mlmd/**"
      - "omnimd-core/**"
      - "omnimd-sim/**"
      - ".github/workflows/mlmd.yml"
  pull_request:
    branches: ["main", "dev", "shawn_dev"]
    paths:
      - "mlmd/**"
      - "omnimd-core/**"
      - "omnimd-sim/**"
      - ".github/workflows/mlmd.yml"

env:
  CARGO_TERM_COLOR: always
  MLMD_MANIFEST: mlmd/Cargo.toml
  MLMD_PACKAGES: -p omnimd-mlmd -p omnimd-native -p omnimd-deepmd -p omnimd-ml-contract

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path $MLMD_MANIFEST $MLMD_PACKAGES -- --check

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mlmd
      - name: Test (CPU)
        shell: bash
        run: cargo test --locked --manifest-path $MLMD_MANIFEST --workspace
      # The CUDA features load NVIDIA libraries at runtime only, so they must
      # compile on a runner without a GPU or CUDA toolkit.
      - name: Build CUDA features (no GPU)
        shell: bash
        run: >
          cargo build --locked --manifest-path $MLMD_MANIFEST
          -p omnimd-mlmd -p omnimd-native
          --features omnimd-mlmd/native-cuda,omnimd-native/cuda --bins

  clippy:
    name: Clippy (advisory)
    runs-on: ubuntu-24.04
    # Clippy has never been enforced on mlmd; report findings without blocking
    # until the existing warnings are cleared.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mlmd
      - run: cargo clippy --locked --manifest-path $MLMD_MANIFEST --workspace --all-targets
